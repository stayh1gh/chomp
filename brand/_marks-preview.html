<!doctype html>
<meta charset="utf-8">
<style>
  body { margin:0; background:#09090a; color:#e3e4e6; font:13px Inter, system-ui, sans-serif; padding:20px; }
  .grid { display:grid; grid-template-columns:1fr; gap:20px; }
  .cell { border:1px solid #1a1b1d; border-radius:10px; padding:14px; display:flex; gap:18px; align-items:center; }
  .lbl { color:#98999c; font-size:11px; letter-spacing:.06em; text-transform:uppercase; width:100%; margin-bottom:6px; }
  .tile32 { width:32px; height:32px; border-radius:8px; background:#212121; display:grid; place-items:center; flex:none; }
  .tile16 { width:16px; height:16px; border-radius:4px; background:#212121; display:grid; place-items:center; flex:none; }
  .lite { background:#fff; border-radius:8px; padding:6px; display:grid; place-items:center; flex:none; }
  .col { display:flex; flex-direction:column; gap:10px; align-items:center; }
</style>
<body>
<div class="grid">

<!-- A: GATED BRAIN -->

    <path d="M20 39 H36" stroke="#ff8d28" stroke-width="2.8"/>
    <circle cx="41" cy="39" r="2.4" fill="#ff8d28"/>
  </svg>
  <div class="col">
    <div class="tile32"><svg width="21" height="21" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 40 C6 36, 8 25, 14.5 23.5 C13 15, 21 9, 28 13 C33 7, 43 9.5, 45 17 C53 18, 56 27, 50.5 32 C54 38, 50 45.5, 43 45.5 L23 45.5 C17 47, 12.5 44.5, 12 40 Z" stroke="#e3e4e6" stroke-width="3.4"/>
      <path d="M40 45.5 C46.5 45.5, 50 49, 48 52.5 C46 56, 40 56, 38 52.5" stroke="#e3e4e6" stroke-width="3.4"/>
      <path d="M20 30 C25 26.5, 28 33, 33.5 29.5" stroke="#5e6ad2" stroke-width="3.2"/>
      <path d="M20 39 H38" stroke="#ff8d28" stroke-width="3.6"/>
    </svg></div>
    <div class="tile16"><svg width="11" height="11" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 40 C6 36, 8 25, 14.5 23.5 C13 15, 21 9, 28 13 C33 7, 43 9.5, 45 17 C53 18, 56 27, 50.5 32 C54 38, 50 45.5, 43 45.5 L23 45.5 C17 47, 12.5 44.5, 12 40 Z" stroke="#e3e4e6" stroke-width="4.6"/>
      <path d="M20 39 H38" stroke="#ff8d28" stroke-width="4.6"/>
    </svg></div>
  </div>
</div>

<!-- D: MONOGRAM -->
