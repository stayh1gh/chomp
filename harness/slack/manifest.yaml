# The Chomp Slack app. api.slack.com/apps → Create New App → From a manifest → paste this.
# Then: Basic Information → App-Level Tokens → Generate (scope connections:write) → the xapp- token;
# Install App → the xoxb- bot token. Paste both, plus your member ID, in Settings → Notifications.
display_information:
  name: Chomp
  description: Messages you when a Chomp card needs you. Reply in the card's thread.
  background_color: "#1f1f24"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Chomp
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:history
      - im:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
